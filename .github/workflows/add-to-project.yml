name: Add PR to PR Review Board
on:
  pull_request:
    types: [opened, reopened]
jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/DvelopersHub/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
